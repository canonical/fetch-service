summary: Artifact inspection

environment:
  POLICY/strict: strict
  POLICY/permissive: permissive

prepare: |
  snap stop fetch-service
  rm -f ./*.json ./*.deb
  rm -f /var/snap/fetch-service/common/log/security.log

restore: |
  snap stop fetch-service
  rm -f ./*.json ./*.deb
  rm -f /var/snap/fetch-service/common/log/security.log

execute: |
  # shellcheck disable=SC1091
  . ../../utils.sh

  snap start fetch-service
  sleep 5  # give some time for the service to start
  fetch-service.fetchctl version

  # check if service is up and running
  get_status

  # create session
  read -r session_id token < <(create_session "$POLICY")

  # set up proxy and download a file
  export http_proxy="http://${session_id}:${token}@localhost:9988"
  export https_proxy="http://${session_id}:${token}@localhost:9988"

  wget --no-check-certificate http://archive.ubuntu.com/ubuntu/pool/main/h/hello/hello_2.10-3build2_amd64.deb ||:
  if [ "$POLICY" == "permissive" ]; then
      test -f hello_2.10-3build2_amd64.deb
  else
      test ! -f hello_2.10-3build2_amd64.deb
  fi

  grep sys_start /var/snap/fetch-service/common/log/security.log
  grep authn_login_success: /var/snap/fetch-service/common/log/security.log

  # download it again

  rm -f hello_2.10-3build2_amd64.deb
  wget --no-check-certificate http://archive.ubuntu.com/ubuntu/pool/main/h/hello/hello_2.10-3build2_amd64.deb ||:
  if [ "$POLICY" == "permissive" ]; then
      test -f hello_2.10-3build2_amd64.deb
  else
      test ! -f hello_2.10-3build2_amd64.deb
  fi

  unset http_proxy
  unset https_proxy

  # revoke token, get report, and end session
  read -r spool_path < <(revoke_token "$session_id" "$token")
  [ -d "$spool_path" ]

  get_session_report "$session_id" > session_report.json

  jq -r '."spool-path"' session_report.json | MATCH "$spool_path"
  jq -r .policy session_report.json | MATCH "$POLICY"
  jq -r '(.artifacts[].metadata | select(.name=="hello")).type' session_report.json | MATCH "application/vnd.debian.binary-package"
  jq -r '(.artifacts[].metadata | select(.name=="hello")).sha256' session_report.json | MATCH "24e6cc07c34cb53fedce7e1e82a501111e5da2a7f8e3125a7e7b32ad18db00f7"
  jq -r '(.artifacts[] | select(.metadata.name=="hello")).result' session_report.json | MATCH "Rejected"
  jq -r '(.artifacts[] | select(.metadata.name=="hello")).metadata.license' session_report.json | MATCH "GPL"

  delete_session "$session_id"

  # check if resources present
  [ -f "$spool_path/$session_id/assets/24e6cc07c34cb53fedce7e1e82a501111e5da2a7f8e3125a7e7b32ad18db00f7.json" ]
  [ -f "$spool_path/$session_id/assets/24e6cc07c34cb53fedce7e1e82a501111e5da2a7f8e3125a7e7b32ad18db00f7.data" ]

  # remove session resources
  delete_resources "$session_id"
  [ ! -d "$spool_path/$session_id" ]
