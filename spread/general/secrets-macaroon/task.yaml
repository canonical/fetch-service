summary: Test 'macaroon' secret support

environment:
  MACAROON: '$(HOST: echo "${STORE_MACAROON}")'

prepare: |
  snap stop fetch-service

  # shellcheck disable=SC2016
  snap_data=$(snap run --shell fetch-service -c 'echo $SNAP_DATA')
  logfile=${snap_data}/fetch.log
  if [ -f "${logfile}" ]; then
    rm -f "${logfile}"
  fi

  snap start fetch-service
  sleep 5
  fetch-service.fetchctl version   

execute: |
  # shellcheck disable=SC1091
  . ../../utils.sh

  if [ -z "${MACAROON}" ]; then
    echo "Credentials not found; is 'STORE_MACAROON' set?"
    exit 1
  fi

  # create permissive session with secrets.
  creds="${MACAROON}"
  secrets='[{"type": "macaroon", "url": "https://api.staging.snapcraft.io:443/**", "macaroon-credentials": "'$creds'"}]'

  read -r session_id token < <(create_session permissive "$secrets")
  
  # set up proxy
  export http_proxy="http://${session_id}:${token}@localhost:9988"
  export https_proxy="http://${session_id}:${token}@localhost:9988"
  
  # The url corresponds to revision 26 of the "starcraft-test" package available on the
  # "ubuntu/starcraft" private plane. This one:
  # 2.0-on-plane-24.04/edge:  2.0.3  2026-03-05  (26)  2kB
  curl -H "X-Plane-Name: ubuntu/starcraft" -L https://api.staging.snapcraft.io/api/v1/bins/download/ysIk8jpfwVGSHUtWkNK1ykhch2mAkOOi_26.bin --output out.bin

  file out.bin | MATCH "XZ compressed data"

  unset http_proxy
  unset https_proxy
  
  # revoke token, get report, and end session
  revoke_token "$session_id" "$token"
  get_session_report "$session_id" | tee session_report.json
  delete_session "$session_id"
  delete_resources "$session_id"

restore: |
  snap stop fetch-service

