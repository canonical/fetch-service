summary: Create session with inspectors configuration

prepare: |
  snap stop fetch-service
  # rm -f ./*.json ./*.deb
  snap start fetch-service
  sleep 5
  fetch-service.fetchctl version

execute: |
  # shellcheck disable=SC1091
  . ../../utils.sh
  
  snap start fetch-service
  sleep 5  # give some time for the service to start
  fetch-service.fetchctl version

  # check if service is up and running
  curl -sf http://localhost:9999/status

  # create a strict session
  session_id=8d9399b526be42678ac6a0a0e76a009b
  token=5lE1VoyOG8t8f0Wsx6DP
  fetch-service.fetchctl create-session --session-id=$session_id --token=$token session-inspectors.yaml

  # set up proxy and download a file
  export http_proxy="http://${session_id}:${token}@localhost:9988"
  export https_proxy="http://${session_id}:${token}@localhost:9988"

  echo "Acquire::http::Proxy \"$http_proxy\";" > /etc/apt/apt.conf.d/99proxy
  echo "Acquire::https::Proxy \"$https_proxy\";" >> /etc/apt/apt.conf.d/99proxy
  
  apt-get update
  apt-get install -y fortune-mod
  
  unset http_proxy
  unset https_proxy
  
  # revoke token, get report, and end session
  revoke_token "$session_id" "$token"
  get_session_report "$session_id" > session_report.json

  # check report
  jq -r '(.artifacts[].metadata | select(.type=="application/vnd.debian.binary-package")).name' session_report.json | MATCH "fortune-mod"
  # artifact was rejected because the repository url is not the "default" archive.ubuntu.com
  jq -r '.artifacts[].result' session_report.json | MATCH "Rejected"
  
  # remove session resources
  delete_session "$session_id"
  delete_resources "$session_id"


restore: |
  snap stop fetch-service
  rm -f ./*.json ./*.deb
  rm -f /etc/apt/apt.conf.d/99proxy
