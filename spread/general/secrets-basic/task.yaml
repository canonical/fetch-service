summary: Test 'basic auth' secret support

systems:
  - -ubuntu-20.04  # Focal git version not supported

environment:
  # GH_FETCH_SERVICE_TOKEN should contain a token that has read access to the fetch-service
  # Github repo. On CI, this can be GITHUB_TOKEN. Locally, one can use a fine-grained token
  # created via https://github.com/settings/personal-access-tokens/new
  # The fine-grained token should be owned by "canonical", and have "Read-only" access to
  # the "Contents" of the "canonical/fetch-service" repository.
  PAT: '$(HOST: echo "${GH_FETCH_SERVICE_TOKEN}")'

prepare: |
  snap stop fetch-service

  # shellcheck disable=SC2016
  snap_data=$(snap run --shell fetch-service -c 'echo $SNAP_DATA')
  logfile=${snap_data}/fetch.log
  if [ -f "${logfile}" ]; then
    rm -f "${logfile}"
  fi

  snap start fetch-service
  sleep 5
  fetch-service.fetchctl version   

execute: |
  # shellcheck disable=SC1091
  . ../../utils.sh

  if [ -z "${PAT}" ]; then
    echo "Credentials not found; is 'GH_FETCH_SERVICE_TOKEN' set?"
    exit 1
  fi

  # create permissive session with secrets. Note that for Github the 'username' doesn't
  # matter, but this isn't true for all git hosts.
  creds="craft-test:${PAT}"
  secrets='[{"type": "basic-auth", "url": "https://github.com:443/canonical/fetch-service.git/**", "basic-credentials": "'$creds'"}]'

  read -r session_id token < <(create_session permissive "$secrets")
  
  # set up proxy
  export http_proxy="http://${session_id}:${token}@localhost:9988"
  export https_proxy="http://${session_id}:${token}@localhost:9988"
  
  # Ensure we don't have the source locally (by accident perhaps)
  [ ! -f "go.mod" ]

  # Try to clone, *without* specifying credentials
  git config --global --add safe.directory "$(pwd)"
  git init .
  
  # This is the url that Github itself gives in the web ui
  git remote add origin https://github.com/canonical/fetch-service.git
  git fetch --depth 1 origin 0.10.1
  git reset --hard FETCH_HEAD
  
  # Sanity check that the source was cloned correctly
  [ -f "go.mod" ]

  unset http_proxy
  unset https_proxy
  
  # revoke token, get report, and end session
  revoke_token "$session_id" "$token"
  get_session_report "$session_id" | tee session_report.json
  delete_session "$session_id"
  delete_resources "$session_id"

restore: |
  snap stop fetch-service
