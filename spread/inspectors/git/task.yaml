summary: Test the git inspector

systems:
  - -ubuntu-20.04  # Git version not supported

prepare: |
  rm -f ./*.json
  rm -Rf starflow

restore: |
  rm -f ./*.json
  rm -Rf starflow

execute: |
  # shellcheck disable=SC1091
  . ../../utils.sh

  # create permissive session
  read -r session_id token < <(create_session permissive)

  # set up proxy
  export http_proxy="http://${session_id}:${token}@localhost:9988"
  export https_proxy="http://${session_id}:${token}@localhost:9988"

  git clone --single-branch --depth=1 https://github.com/canonical/starflow
  test -f starflow/LICENSE

  unset http_proxy
  unset https_proxy

  revoke_token "$session_id" "$token"
  get_session_report "$session_id" > session_report.json
  python3 -mjson.tool session_report.json

  jq -r '(.artifacts[].metadata | select(.name=="git upload-pack advertisement")).type' session_report.json | MATCH "application/x.git.upload-pack-advertisement"
  jq -r '(.artifacts[].metadata | select(.name=="git ls-refs response")).type' session_report.json | MATCH "application/x.git.upload-pack-result.ls-ref"
  jq -r '(.artifacts[].metadata | select(.name=="git fetch response")).type' session_report.json | MATCH "application/x.git.upload-pack-result.fetch"

  delete_session "$session_id"
  delete_resources "$session_id"
