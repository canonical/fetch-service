name: TICS

on:
  pull_request:
    paths:
      - .github/workflows/tics.yaml
  push:
    branches:
      - main
      # to easy test changes to the workflow
      - work/tiobe**

jobs:
  CI:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, reactive, amd64, tiobe, noble]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: |
          echo "::group::apt-get update"
          sudo apt-get update
          echo "::endgroup::"
          echo "::group::apt-get install..."
          sudo apt-get install -y licensecheck
          echo "::endgroup::"
          echo "::group::staticcheck"
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          echo "::endgroup::"
          echo "::group::gocov"
          # gocov v1.2.1 pins an old golang.org/x/tools v0.13.0 dependency whose
          # internal/tokeninternal static assertion fails to compile on modern Go.
          # Build from source with a Go 1.25-compatible x/tools version.
          git clone --depth=1 https://github.com/axw/gocov.git /tmp/gocov
          (cd /tmp/gocov && go get golang.org/x/tools@v0.49.0 && go mod tidy && go install ./gocov)
          rm -rf /tmp/gocov
          go install github.com/AlekSi/gocov-xml@latest
          echo "::endgroup::"

      - name: Build code
        run: |
          go generate ./...
          go build ./cmd/fetch

      - name: Run unit tests
        run: |
          mkdir .coverage
          go test -coverprofile .coverage/cover.out ./...
          cd .coverage
          ~/go/bin/gocov convert cover.out > coverage.json
          ~/go/bin/gocov-xml < coverage.json > coverage-go.xml

      - name: Run TICS analysis
        uses: tiobe/tics-github-action@v3
        with:
          mode: qserver
          project: fetch-service
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=GoProjects
          branchdir: ${{ github.workspace }}
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
          installTics: true
