name: cla-check
on:
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  cla-check:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check if CLA signed
        uses: canonical/has-signed-canonical-cla@v2
