name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  #linters:
  #  runs-on: ubuntu-latest
  #  steps:
  #    - uses: actions/checkout@v3
  #    - uses: actions/setup-go@v4
  #      with:
  #        go-version: '1.20'
  #        cache: false
  #    - name: golangci-lint
  #      uses: golangci/golangci-lint-action@v3
  #      with:
  #        version: v3.6.0

  tests:
    strategy:
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.18'
      - name: Run vet
        run: |
          go vet ./...
      - name: Build code
        run: |
          go build ./cmd/fetch
      - name: Run unit tests
        run: |
          go test ./...
