name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  linters:
    runs-on: [self-hosted, Linux]  # Pretty much any self-hosted Linux runner, base independent
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Generate version
        run: |
          go generate ./version
      - name: Run Linters
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: Run shellcheck
        run: |
          shellcheck spread/.extension
          spread/tools/utils/spread-shellcheck -v spread.yaml
          find spread -name task.yaml | xargs spread/tools/utils/spread-shellcheck -v

  unit-tests:
    runs-on: [noble, amd64]
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y licensecheck
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Generate version
        run: |
          go generate ./version
      - name: Build code
        run: |
          go build ./cmd/fetch
      - name: Run unit tests
        run: |
          go test -race ./...

  snap-build:
    runs-on: [noble, amd64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build snap
        uses: canonical/action-build@v1
        id: snap
      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.snap.outputs.snap }}

  snap-test:
    strategy:
      matrix:
        os:
          - [jammy, amd64]
          - [noble, amd64]
    # needs:  # Re-enable this once we can test a prebuilt snap
    #   - snap-build
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install dependencies
        run: |
          sudo snap install snapcraft --classic --channel=latest/edge
          sudo snap install lxd  # remove once we can test a pre-built snap
          lxd init --auto
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download snap artifact
        uses: actions/download-artifact@v4
        with:
          name: snap
      - name: Run spread tests
        run: |
          snapcraft test --verbose
