project: craft-test

environment:
  # important to ensure adhoc and linode/qemu behave the same
  SUDO_USER: ""
  SUDO_UID: ""
  
  LANG: "C.UTF-8"
  LANGUAGE: "en"

  PROJECT_PATH: /home/spread/proj

backends:
  lxd-vm:
    type: adhoc
    allocate: |
      ADDRESS "$(tests/spread/craft-test allocate)"
    discard: |
      tests/spread/craft-test discard
    systems:
      - ubuntu-22.04:
          username: spread
          password: spread

  localhost:
    type: adhoc
    allocate: |
      ADDRESS "$(tests/spread/craft-test allocate)"
    discard: |
      tests/spread/craft-test discard
    systems:
      - ubuntu-22.04:
          username: spread
          password: spread
          workers: 1

suites:
  tests/spread/general/:
    summary: General integration tests
    systems:
      - ubuntu-22.04
    environment:

exclude:
  - .git
  - .tox

path: /home/spread/proj

prepare: $PROJECT_PATH/tests/spread/craft-test prepare
restore: $PROJECT_PATH/tests/spread/craft-test restore
prepare-each: $PROJECT_PATH/tests/spread/craft-test prepare-each
restore-each: $PROJECT_PATH/tests/spread/craft-test restore-each

kill-timeout: 1h
