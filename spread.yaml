project: fetch-service

backends:
  craft:
    type: craft
    systems:
      - ubuntu-24.04:
      #- fedora-40-cloud:   # XXX: fetchctl not running on fedora, must investigate and fix

suites:
  spread/inspectors/:
    summary: Inspector smoke tests
    prepare: |
      snap install "$CRAFT_ARTIFACT" --dangerous
      snap set fetch-service permissive=true
      snap set fetch-service control.auth=craft:craft
      snap set fetch-service log.file=fetch.log
      mkdir -p /usr/local/share/ca-certicates
      cp /var/snap/fetch-service/current/local-ca.crt /usr/local/share/ca-certificates
      update-ca-certificates
      systemctl restart snapd
    prepare-each: |
      snap stop fetch-service
      snap start fetch-service
      sleep 5
      fetch-service.fetchctl version
    restore-each: |
      snap stop fetch-service
    debug-each: |
      # Dump the fetch-service log, if it exists
      # shellcheck disable=SC2016
      snap_data=$(snap run --shell fetch-service -c 'echo $SNAP_DATA')
      logfile=${snap_data}/fetch.log
      if [ -f "${logfile}" ]; then
        echo "fetch-service log output:"
        cat "${logfile}"
      else
        echo "fetch-service logfile does not exist."
      fi

    
exclude:
  - .git

kill-timeout: 1h
