project: craft-test
environment:
  SUDO_USER: ''
  SUDO_UID: ''
  LANG: C.UTF-8
  LANGUAGE: en
  PROJECT_PATH: /home/spread/proj
backends:
  craft:
    type: adhoc
    allocate: ADDRESS $(spread/.extension allocate lxd-vm)
    discard: spread/.extension discard lxd-vm
    systems:
    - ubuntu-24.04:
        username: spread
        password: spread
        workers: 1
    - ubuntu-22.04:
        username: spread
        password: spread
        workers: 1
    - ubuntu-20.04:
        username: spread
        password: spread
        workers: 1
    prepare: '"$PROJECT_PATH"/spread/.extension prepare lxd-vm'
    restore: '"$PROJECT_PATH"/spread/.extension restore lxd-vm'
    prepare-each: '"$PROJECT_PATH"/spread/.extension prepare-each lxd-vm'
    restore-each: '"$PROJECT_PATH"/spread/.extension restore-each lxd-vm'
  ci:  # added by hand, this will be dynamically generated by the craft tool
    type: adhoc
    allocate: ADDRESS $(spread/.extension allocate ci)
    discard: spread/.extension discard ci
    systems:
    - ubuntu-24.04:
        username: spread
        password: spread
        workers: 1
      #- ubuntu-22.04:
        #  username: spread
        #password: spread
        #workers: 1
    - ubuntu-20.04:
        username: spread
        password: spread
        workers: 1
    prepare: '"$PROJECT_PATH"/spread/.extension prepare ci'
    restore: '"$PROJECT_PATH"/spread/.extension restore ci'
    prepare-each: '"$PROJECT_PATH"/spread/.extension prepare-each ci'
    restore-each: '"$PROJECT_PATH"/spread/.extension restore-each ci'
suites:
  spread/general/:
    summary: General integration tests
    systems:
    - ubuntu-24.04
    - ubuntu-22.04
    - ubuntu-20.04
    environment:
      PATH: $PATH:$PROJECT_PATH/spread/tools/tools
    prepare: |
      #tests.pkgs install curl jq
      apt install -y curl jq
      snap install "$PROJECT_PATH"/spread/fetch-service_*.snap --dangerous
      snap set fetch-service permissive=true
      snap set fetch-service control.auth=craft:craft
  spread/install/:
    summary: Snap install and upgrade tests
    systems:
    - ubuntu-24.04
    - ubuntu-22.04
    - ubuntu-20.04
    prepare: |
      snap install yq
    restore: |
      snap remove fetch-service --purge
    prepare-each: |
      snap remove fetch-service --purge
exclude:
- .git
path: /home/spread/proj
kill-timeout: 1h
